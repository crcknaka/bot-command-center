name: Check

# Deploys are run by hand through Coolify on the home server (no push-to-deploy there);
# this workflow only verifies that what was pushed builds and passes tests.
on:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
